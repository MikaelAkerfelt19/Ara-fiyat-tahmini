[tool.pytest.ini_options]
pythonpath = ["."]   # testler "from src..." içe aktarabilsin
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "notebooks"]  # belgelerdeki örnek kodlar ve keşif notebook'ları denetlenmez

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
